openapi: 3.0.3

info:
  title: Diary API
  version: 1.0.0
  description: |
    Backend API for a personal diary application (Express + Supabase). It covers account registration and
    e-mail confirmation, cookie-based session handling, diary records with tags, and account settings.


    ## Authentication

    Authentication is **cookie-based**. The `Authorization: Bearer` header is **not** read anywhere in the
    implementation and must not be used.

    | Cookie          | Content                                      | Signed with      | Cookie `Max-Age`        |
    |-----------------|----------------------------------------------|------------------|-------------------------|
    | `access_token`  | JWT with payload `{ "email": <user e-mail> }` | `JWT_SECRET`     | 900 s (15 minutes)      |
    | `refresh_token` | JWT with payload `{ "email": <user e-mail> }` | `REFRESH_SECRET` | 604800 s (7 days)       |

    - Both cookies are set by `POST /api/login`; `POST /api/refresh` re-issues only `access_token`.
    - Cookie attributes: `HttpOnly`, `Path=/`. `Secure` is set and `SameSite=None` is used when the `PROD`
      environment variable equals `"true"`; otherwise `Secure` is not set and `SameSite=Lax` is used.
    - The JWT lifetime (`expiresIn`) comes from the `JWT_EXPIRE` / `REFRESH_EXPIRE` environment variables,
      while the cookie `Max-Age` values above are hard-coded in the source.
    - The user is identified by the `email` claim of the access token; every protected endpoint looks the user
      up by that e-mail address.
    - Swagger UI cannot send or inspect `HttpOnly` cookies from the "Try it out" panel. Call `POST /api/login`
      from a client that keeps cookies (browser session, Postman cookie jar) and the cookies are then sent
      automatically.

    ## CORS

    The server enables CORS with `credentials: true` for exactly two origins: `http://localhost:3000` and
    `https://diary-cosmic-liard.vercel.app`.

    ## Request bodies

    All JSON request bodies are parsed with `express.json()`, so requests must use
    `Content-Type: application/json`.

    ## Notes

    1. **Dynamic error messages.** Several 400 responses return `error.message` from Supabase; the text is
       produced by the database layer and cannot be determined from the source.

servers:
  - url: http://localhost:{port}
    description: Local development server (port is configured through the `PORT` environment variable).
    variables:
      port:
        default: "3001"
        description: Value of the `PORT` environment variable. 3001 is taken from a comment in the source code.

tags:
  - name: Authentication
    description: Registration, e-mail confirmation, login, token refresh and logout.
  - name: Account
    description: Current-user information and account settings (e-mail, password, username, deletion).
  - name: Diary
    description: Diary records and the user's tag lists.
  - name: System
    description: Service health.

paths:
  /api/register:
    post:
      tags: [Authentication]
      operationId: register
      summary: Register a new user
      description: |
        Creates a user with a bcrypt-hashed password and a random
        confirmation token, then sends a confirmation e-mail with a link to `GET /api/confirm?token=...`.
        The account cannot log in until the e-mail is confirmed.

        Only `email` and `password` are validated.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              username: diary_user
              email: user@example.com
              password: S3cretPass!
      responses:
        '200':
          description: User created and confirmation e-mail sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: "Registered! Check your email to confirm."
        '400':
          description: Validation failed or the database rejected the insert.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              examples:
                missingFields:
                  summary: "`email` or `password` missing/empty"
                  value:
                    message: "Email and password required"
                databaseError:
                  summary: Supabase insert error (message is dynamic)
                  value:
                    message: "<<Dynamic error message from database>>"
        '500':
          description: The confirmation e-mail could not be sent, or an unexpected error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              examples:
                emailSendFailed:
                  value:
                    message: "Email send failed"
                serverError:
                  value:
                    message: "Server error"

  /api/confirm:
    get:
      tags: [Authentication]
      operationId: confirmEmail
      summary: Confirm a registration e-mail address
      description: |
        Click the link in the registration email to confirm your registration. Sender's name: <<Light>>. The email may end up in the “Spam” folder of your inbox.
      security: []
      parameters:
        - name: token
          in: query
          required: true
          description: Confirmation token generated at registration (64 hexadecimal characters as generated by the server).
          schema:
            type: string
          example: 3f9a1c0e5b7d4a62b8c1e9d0a7f3c5b2e1d4f6a8b0c2d4e6f8a1b3c5d7e9f0a2
      responses:
        '200':
          description: E-mail confirmed.
          content:
            text/html:
              schema:
                type: string
              example: "Email confirmed! You can now login."
        '400':
          description: Token missing, or the token is invalid/expired (RPC returned an error or no success).
          content:
            text/html:
              schema:
                type: string
              examples:
                tokenMissing:
                  value: "The token is missing"
                tokenInvalid:
                  value: "Invalid or expired token. Or just try login ;) \n Or...wait a minute and try again(gmail)"
        '500':
          description: Unexpected error.
          content:
            text/html:
              schema:
                type: string
              example: "Server error"

  /api/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Log in
      description: |
        Verifies the e-mail/password pair and, on success, sets the `access_token` and `refresh_token`
        HttpOnly cookies. The response body contains only a message; no token is returned in the body.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: user@example.com
              password: S3cretPass!
      responses:
        '200':
          description: Logged in. Cookies `access_token` and `refresh_token` are set.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookieLogin'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: "Logged in!"
        '400':
          description: Missing fields, unknown e-mail, or wrong password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              examples:
                missingFields:
                  value:
                    message: "Email and password required"
                invalidCredentials:
                  value:
                    message: "Invalid email or password"
        '403':
          description: The e-mail address has not been confirmed yet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: "Email not confirmed"
        '500':
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: "Server error"

  /api/refresh:
    post:
      tags: [Authentication]
      operationId: refreshToken
      summary: Issue a new access token
      description: |
        Reads the `refresh_token` cookie, verifies it with `REFRESH_SECRET`, and sets a new `access_token`
        cookie. No request body is accepted.
      security:
        - refreshTokenCookie: []
      responses:
        '200':
          description: New `access_token` cookie set.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookieRefresh'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: "Token refreshed"
        '401':
          description: The refresh cookie is missing, or the refresh token is invalid/expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              examples:
                noRefreshToken:
                  value:
                    message: "No refresh token"
                invalidRefreshToken:
                  value:
                    message: "Invalid refresh token"

  /api/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: Log out
      description: |
        Clears the `access_token` and `refresh_token` cookies. Tokens are not invalidated server-side.
      security: []
      responses:
        '200':
          description: Cookies cleared.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookieClear'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: "Logged out"

  /api/me:
    get:
      tags: [Account]
      operationId: getCurrentUser
      summary: Get the current user
      description: |
        Verifies the `access_token` cookie and returns `username`, `email` and `created_at` of the matching
        user.
      security:
        - accessTokenCookie: []
      responses:
        '200':
          description: Current user data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
              example:
                user:
                  username: diary_user
                  email: user@example.com
                  created_at: "2026-10-20T18:54:43.326119+00:00"
        '401':
          $ref: '#/components/responses/InvalidToken'
        '403':
          $ref: '#/components/responses/NoToken'
        '404':
          $ref: '#/components/responses/UserNotFound'

  /api/ping:
    get:
      tags: [System]
      operationId: ping
      summary: Health check
      description: Keep-alive endpoint. Requires no authentication.
      security: []
      responses:
        '200':
          description: Server is running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PingResponse'
              example:
                status: ok

  /api/diary:
    post:
      tags: [Diary]
      operationId: getDiary
      summary: List the user's diary records and tags
      description: |
        Returns all rows of `usersRecords` belonging to the authenticated user, ordered by `created_at`
        descending, together with the user's `usersTags` row.

        `diaryAllTags` is the user's `usersTags` row, or an empty array `[]` when no row exists.
      security:
        - accessTokenCookie: []
      responses:
        '200':
          description: Diary records and tags.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiaryListResponse'
              example:
                example:
                  diaryRecords:
                    - id_user: 314
                      title: My day at the park
                      date: '2026-10-26'
                      feels:
                        - happy
                      tags:
                        - outdoors
                        - fun
                      color_Tags:
                        - green
                        - blue
                      highlights:
                        - text: Had a great picnic
                          color: green
                      id_record: c72aee5f-fc3c-4ed1-9413-4860733eb4b5
                      created_at: '2026-10-24T12:39:27.254935+00:00'
                  diaryAllTags:
                    all_Tags:
                      - outdoors
                      - fun
                      - apple
                    all_Color_Tags:
                      - green
                      - blue
                      - purple
                    id_user: 314
        '400':
          description: Supabase returned an error while reading records or tags (message is dynamic).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: "<<Error message is dynamic>>"
        '401':
          $ref: '#/components/responses/InvalidToken'
        '403':
          $ref: '#/components/responses/NoToken'
        '404':
          $ref: '#/components/responses/UserNotFound'

  /api/diary-send:
    post:
      tags: [Diary]
      operationId: createDiaryRecord
      summary: Create a diary record and store the user's tag lists
      description: |
        Inserts a new record for the authenticated user.
        If user provided new tags --> update database with new tags in `all_Tags` and `all_Color_Tags` arrays.

        If the record insert succeeds and the tag insert fails, the response is
        400 but the record remains.
      security:
        - accessTokenCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiaryCreateRequest'
            example:
             example:
              title: My day at the park
              date: '2026-10-26'
              feels:
                - happy
              tags:
                - outdoors
                - fun
              color_Tags:
                - green
                - blue
              highlights:
                - text: Had a great picnic
                  color: green
              all_Tags:
                - outdoors
                - fun
                - apple
              all_Color_Tags:
                - green
                - blue
                - purple
      responses:
        '200':
          description: Record and tags inserted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: "Record and tags added"
        '400':
          description: Supabase returned an error for the record insert or the tag upsert (message is dynamic).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: "?"
        '401':
          description: |
            Invalid, malformed or expired
            access token. `message` is the caught error's `message` (dynamic).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: "Error message is dynamic"
        '403':
          $ref: '#/components/responses/NoToken'
        '404':
          $ref: '#/components/responses/UserNotFound'

  /api/diary-allTags:
    post:
      tags: [Diary]
      operationId: getAllTags
      summary: Get the user's tag lists
      description: |
        Returns `all_Tags` and `all_Color_Tags` from the user's `usersTags` row. If no row can be read, the
        server responds with status 200 and a message instead of the tag data. Although it only reads data,
        the route is implemented as `POST`; no request body is read.
      security:
        - accessTokenCookie: []
      responses:
        '200':
          description: Tag lists, or a message when no tag row exists (or the lookup returned an error).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/TagsData'
                  - $ref: '#/components/schemas/MessageResponse'
              examples:
                tags:
                  summary: Tag row found
                  value:
                    all_Tags: "?"
                    all_Color_Tags: "?"
                noRecords:
                  summary: No tag row found
                  value:
                    message: "No records to edit"
        '401':
          description: The access token is invalid, malformed or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: "Invalid token"
        '403':
          $ref: '#/components/responses/NoToken'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/diary-record/{id}:
    get:
      tags: [Diary]
      operationId: getDiaryRecord
      summary: Get one diary record by id
      description: |
        Returns the record whose `id_record` equals the path parameter and whose `id_user` belongs to the
        authenticated user. `id_user` in the response is the authenticated user's id.

        `all_Tags` and `all_Color_Tags` are read from the `usersRecords` row (see Verification notes) and may
        therefore be absent from the response.
      security:
        - accessTokenCookie: []
      parameters:
        - $ref: '#/components/parameters/RecordId'
      responses:
        '200':
          description: The requested record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiaryRecordResponse'
              example:
                id_record: "?"
                id_user: "?"
                title: "?"
                date: "?"
                feels: "?"
                tags: "?"
                color_Tags: "?"
                highlights: "?"
                all_Tags: "?"
                all_Color_Tags: "?"
        '401':
          $ref: '#/components/responses/InvalidToken'
        '403':
          $ref: '#/components/responses/NoToken'
        '404':
          description: No record with this id exists for the authenticated user (or the record query failed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: "Record not found"

  /api/diary-edit:
    post:
      tags: [Diary]
      operationId: updateDiaryRecord
      summary: Update a diary record and the user's tag lists
      description: |
        Updates the `usersRecords` row identified by `record.id_record` (restricted to the authenticated
        user) with `title`, `date`, `feels`, `highlights`, `tags` and `color_Tags`, and updates the user's
        `usersTags` row with `record.all_Tags` and `record.all_Color_Tags`.

        The tag update is executed **before** the record result is checked, so tags may be updated even when
        the response is 404. The tag update uses `update` (not upsert), so it has no effect if the user has no
        `usersTags` row.

        All request properties are nested under the top-level `record` object. If `record` is missing, the
        handler throws and responds with 401 `"Invalid token"`; the same response is returned if the user
        lookup yields no user.
      security:
        - accessTokenCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiaryEditRequest'
            example:
              record:
                id_record: 12
                title: A quiet Sunday (edited)
                date: "2025-01-19"
                feels: calm
                tags:
                  - rest
                  - family
                color_Tags:
                  - "#4f9dff"
                  - "#ffb84f"
                highlights:
                  - Long walk
                all_Tags:
                  - rest
                  - family
                  - work
                all_Color_Tags:
                  - "#4f9dff"
                  - "#ffb84f"
                  - "#ff4f4f"
      responses:
        '200':
          description: Record and tags updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: "Record updated"
        '400':
          description: Supabase returned an error for the tag update or the record update (message is dynamic).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: "?"
        '401':
          description: |
            Invalid, malformed or expired access token, or any other exception thrown in the handler
            (for example a missing `record` object).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: "Invalid token"
        '403':
          $ref: '#/components/responses/NoToken'
        '404':
          description: The update matched no record for the authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: "Record not found"

  /api/diary-delete/{id}:
    delete:
      tags: [Diary]
      operationId: deleteDiaryRecord
      summary: Delete a diary record
      description: |
        Deletes the `usersRecords` row with the given `id_record` that belongs to the authenticated user.
        The user's tag row is not modified. The handler responds 200 whenever Supabase reports no error (see
        Verification notes).
      security:
        - accessTokenCookie: []
      parameters:
        - $ref: '#/components/parameters/RecordId'
      responses:
        '200':
          description: Delete operation completed without error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: "Record deleted"
        '400':
          description: Supabase returned an error for the delete (message is dynamic).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: "?"
        '401':
          $ref: '#/components/responses/InvalidToken'
        '403':
          $ref: '#/components/responses/NoToken'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/change-email-request:
    post:
      tags: [Account]
      operationId: requestEmailChange
      summary: Request an e-mail address change
      description: |
        Stores `newEmail` and a random confirmation token on the authenticated user's row (`new_email`,
        `email_change_token`) and sends a confirmation e-mail to `newEmail` containing a link to
        `GET /api/change-email-confirm?token=...`. The address is changed only after that link is opened.

        The server does not validate `newEmail` and does not check the result of the database update.

        Unlike other protected endpoints, **any** failure inside the `try` block, including an invalid or
        expired access token, is returned as 500 `"Server error"` (not 401).
      security:
        - accessTokenCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeEmailRequest'
            example:
              newEmail: new.address@example.com
      responses:
        '200':
          description: Confirmation e-mail sent to the new address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: "Confirm new email first"
        '403':
          $ref: '#/components/responses/NoToken'
        '500':
          description: |
            Invalid/expired access token, e-mail sending failure, or any other unexpected error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: "Server error"

  /api/change-email-confirm:
    get:
      tags: [Account]
      operationId: confirmEmailChange
      summary: Confirm an e-mail address change
      description: |
        Target of the link in the e-mail-change confirmation message. Finds the user by `email_change_token`,
        replaces `email` with the stored `new_email`, clears `new_email` and `email_change_token`, and clears
        the `access_token` and `refresh_token` cookies (without cookie options, i.e. default path `/`), so the
        user must log in again. Responses are plain strings sent with `res.send()` (served as `text/html`).

        This endpoint changes state via `GET` and requires no authentication; the token is the credential.
      security: []
      parameters:
        - name: token
          in: query
          required: true
          description: E-mail change token generated by `POST /api/change-email-request`.
          schema:
            type: string
          example: 9b2d7e4f1a6c3e8d5b0f2a4c6e8d1f3b5a7c9e0d2f4b6a8c1e3d5f7a9b0c2d4e
      responses:
        '200':
          description: E-mail updated; session cookies cleared.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookieClear'
          content:
            text/html:
              schema:
                type: string
              example: "Email updated. Login again."
        '400':
          description: Token missing.
          content:
            text/html:
              schema:
                type: string
              example: "Token missing"
        '401':
          description: No user matches the token (or the lookup failed).
          content:
            text/html:
              schema:
                type: string
              example: "Invalid token"
        '500':
          description: Unexpected error.
          content:
            text/html:
              schema:
                type: string
              example: "Server error"

  /api/change-password:
    post:
      tags: [Account]
      operationId: changePassword
      summary: Change the password
      description: |
        Verifies `currentPassword` against the stored bcrypt hash and, if it matches, stores a new bcrypt hash
        (cost factor 10) of `newPassword`. The token check (403) is performed before the body validation (400).
        No password strength rules are enforced, and existing tokens/cookies remain valid.
      security:
        - accessTokenCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
            example:
              currentPassword: S3cretPass!
              newPassword: EvenB3tterPass!
      responses:
        '200':
          description: Password updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: "Password updated"
        '400':
          description: A password field is missing, the current password is wrong, or the database update failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              examples:
                missingFields:
                  value:
                    message: "Passwords required"
                wrongCurrentPassword:
                  value:
                    message: "Current password incorrect"
                databaseError:
                  summary: Supabase update error (message is dynamic)
                  value:
                    message: "?"
        '401':
          $ref: '#/components/responses/InvalidToken'
        '403':
          $ref: '#/components/responses/NoToken'
        '404':
          $ref: '#/components/responses/UserNotFound'

  /api/change-username:
    post:
      tags: [Account]
      operationId: changeUsername
      summary: Change the username
      description: |
        Updates `username` on the authenticated user's row. The token check (403) is performed before the body
        validation (400). No length or character rules are enforced.
      security:
        - accessTokenCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeUsernameRequest'
            example:
              username: new_diary_user
      responses:
        '200':
          description: Username updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: "Username updated"
        '400':
          description: "`username` missing/empty, or the database update failed."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              examples:
                missingUsername:
                  value:
                    message: "Username required"
                databaseError:
                  summary: Supabase update error (message is dynamic)
                  value:
                    message: "?"
        '401':
          $ref: '#/components/responses/InvalidToken'
        '403':
          $ref: '#/components/responses/NoToken'

  /api/user-delete:
    delete:
      tags: [Account]
      operationId: deleteAccount
      summary: Delete the current account
      description: |
        Deletes the authenticated user's row from `users` (looked up by the e-mail in the access token) and
        clears the `access_token` and `refresh_token` cookies with `{ path: "/" }` only. No request body or
        password confirmation is required. Whether the user's records and tags are also removed depends on
        database cascade rules that are not part of the source.
      security:
        - accessTokenCookie: []
      responses:
        '200':
          description: Account deleted; session cookies cleared.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookieClear'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: "Account deleted"
        '400':
          description: Supabase returned an error for the delete (message is dynamic).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: "?"
        '401':
          $ref: '#/components/responses/InvalidToken'
        '403':
          $ref: '#/components/responses/NoToken'

components:
  securitySchemes:
    accessTokenCookie:
      type: apiKey
      in: cookie
      name: access_token
      description: |
        HttpOnly cookie holding a JWT (payload `{ "email": ... }`) signed with `JWT_SECRET`. Set by
        `POST /api/login` and `POST /api/refresh`; cookie `Max-Age` is 900 seconds. The Bearer scheme is not
        supported. A missing cookie yields 403 `"No token"`; an invalid or expired token yields 401 (message
        varies per endpoint, see the individual operations).
    refreshTokenCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: |
        HttpOnly cookie holding a JWT (payload `{ "email": ... }`) signed with `REFRESH_SECRET`. Set by
        `POST /api/login`; cookie `Max-Age` is 604800 seconds. Used only by `POST /api/refresh`.

  parameters:
    RecordId:
      name: id
      in: path
      required: true
      description: |
        Value matched against the `id_record` column of `usersRecords`. The column type is not determinable
        from the source.
      schema:
        type: string
      example: "12"

  headers:
    SetCookieLogin:
      description: |
        Two `Set-Cookie` headers are sent: `access_token` (`Max-Age=900`) and `refresh_token`
        (`Max-Age=604800`). Both have `HttpOnly` and `Path=/`; `Secure` and `SameSite=None` are used when
        `PROD=true`, otherwise `SameSite=Lax` without `Secure`.
      schema:
        type: string
      examples:
        accessToken:
          value: "access_token=<jwt>; Max-Age=900; Path=/; Expires=<HTTP-date>; HttpOnly; SameSite=Lax"
        refreshToken:
          value: "refresh_token=<jwt>; Max-Age=604800; Path=/; Expires=<HTTP-date>; HttpOnly; SameSite=Lax"
    SetCookieRefresh:
      description: |
        A `Set-Cookie` header replacing `access_token` (`Max-Age=900`, `HttpOnly`, `Path=/`; `Secure` and
        `SameSite=None` when `PROD=true`, otherwise `SameSite=Lax`).
      schema:
        type: string
      example: "access_token=<jwt>; Max-Age=900; Path=/; Expires=<HTTP-date>; HttpOnly; SameSite=Lax"
    SetCookieClear:
      description: |
        Two `Set-Cookie` headers expire `access_token` and `refresh_token` (empty value, `Expires` set to
        the Unix epoch). The cookie attributes sent with the expiry differ per endpoint: `POST /api/logout`
        uses the same options as at login; `DELETE /api/user-delete` uses `Path=/` only; `GET
        /api/change-email-confirm` uses Express defaults (`Path=/`).
      schema:
        type: string
      example: "access_token=; Path=/; Expires=Thu, 01 Jan 1970 00:00:00 GMT"

  responses:
    NoToken:
      description: The `access_token` cookie is missing.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
          example:
            message: "No token"
    InvalidToken:
      description: |
        The access token is invalid, malformed or expired.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
          example:
            message: "Invalid token"
    UserNotFound:
      description: No user matches the e-mail claim in the access token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
          example:
            message: "User not found"
    ServerError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
          example:
            message: "Server error"

  schemas:
    MessageResponse:
      type: object
      description: Standard JSON body used by the server for both success messages and error messages.
      required: [message]
      properties:
        message:
          type: string
          example: "Logged in!"

    PingResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok

    RegisterRequest:
      type: object
      description: |
        Only `email` and `password` are validated by the server (must be truthy). `username` is optional.
      required: [email, password]
      properties:
        username:
          type: string
          description: Optional display name. Not validated.
          example: diary_user
        email:
          type: string
          description: Used as the login identifier and as the recipient of the confirmation e-mail. Format is not validated.
          example: user@example.com
        password:
          type: string
          description: Hashed with bcrypt (cost 10). No strength rules are enforced.
          example: S3cretPass!

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          example: user@example.com
        password:
          type: string
          example: S3cretPass!

    ChangeEmailRequest:
      type: object
      description: |
        `newEmail` is not validated by the server, but the confirmation e-mail is sent to it, so it is
        needed for the operation to succeed.
      required: [newEmail]
      properties:
        newEmail:
          type: string
          example: new.address@example.com

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          example: S3cretPass!
        newPassword:
          type: string
          description: Hashed with bcrypt (cost 10). No strength rules are enforced.
          example: EvenB3tterPass!

    ChangeUsernameRequest:
      type: object
      required: [username]
      properties:
        username:
          type: string
          example: new_diary_user

    User:
      type: object
      description: User data returned by `GET /api/me`.
      properties:
        username:
          type: string
          example: diary_user
        email:
          type: string
          example: user@example.com
        created_at:
          description: Creation timestamp column of `users`. Type/format is not determinable from the source.
          example: "?"

    MeResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/User'

    TagsData:
      type: object
      description: |
        The user's tag lists as stored in `usersTags`. The value types are passed through unchanged from
        request bodies and are not determinable from the source.
      properties:
        all_Tags:
          description: All tags of the user. Type not determinable from the source.
          example: "?"
        all_Color_Tags:
          description: Colors associated with the user's tags. Type not determinable from the source.
          example: "?"

    UsersTagsRow:
      description: |
        A row of `usersTags` as returned by `select("*")`. Only the properties known from the code are listed;
        other columns may exist.
      allOf:
        - $ref: '#/components/schemas/TagsData'
        - type: object
          properties:
            id_user:
              description: Owner's user id. Type not determinable from the source.
              example: "?"
          additionalProperties: true

    DiaryRecord:
      type: object
      description: |
        A row of `usersRecords` as returned by `select("*")`. Only the properties known from the code are
        listed; other columns may exist. Value types are not determinable from the source.
      properties:
        id_record:
          description: Record identifier.
          example: "?"
        id_user:
          description: Owner's user id.
          example: "?"
        title:
          description: Record title.
          example: "?"
        date:
          description: Record date.
          example: "?"
        feels:
          description: Mood/feeling value.
          example: "?"
        tags:
          description: Tags assigned to the record.
          example: "?"
        color_Tags:
          description: Colors of the tags assigned to the record.
          example: "?"
        highlights:
          description: Highlights of the record.
          example: "?"
        created_at:
          description: Creation timestamp used for ordering (descending).
          example: "?"
      additionalProperties: true

    DiaryListResponse:
      type: object
      required: [diaryRecords, diaryAllTags]
      properties:
        diaryRecords:
          type: array
          description: Records of the user, newest `created_at` first. Empty array if none.
          items:
            $ref: '#/components/schemas/DiaryRecord'
        diaryAllTags:
          description: The user's `usersTags` row, or an empty array (`[]`) when the user has none.
          oneOf:
            - $ref: '#/components/schemas/UsersTagsRow'
            - type: array
              maxItems: 0
              items: {}

    DiaryRecordResponse:
      type: object
      description: |
        Response of `GET /api/diary-record/{id}`. Keys are exactly those assembled by the handler. A property
        whose value is `undefined` (possible for `all_Tags` and `all_Color_Tags`, see Verification notes) is
        omitted from the JSON.
      properties:
        id_record:
          description: Record identifier.
          example: "?"
        id_user:
          description: Id of the authenticated user.
          example: "?"
        title:
          description: Record title.
          example: "?"
        date:
          description: Record date.
          example: "?"
        feels:
          description: Mood/feeling value.
          example: "?"
        tags:
          description: Tags assigned to the record.
          example: "?"
        color_Tags:
          description: Colors of the tags assigned to the record.
          example: "?"
        highlights:
          description: Highlights of the record.
          example: "?"
        all_Tags:
          description: Read from the `usersRecords` row; may be absent.
          example: "?"
        all_Color_Tags:
          description: Read from the `usersRecords` row; may be absent.
          example: "?"

    DiaryCreateRequest:
      type: object
      description: |
        Body of `POST /api/diary-send`. The server validates none of these properties and does not mark any as
        required; values are inserted into `usersRecords` (`title`, `date`, `feels`, `tags`, `color_Tags`,
        `highlights`) and `usersTags` (`all_Tags`, `all_Color_Tags`) as received. Types below are therefore
        unspecified; example values are illustrative.
      properties:
        title:
          description: Record title.
          example: A quiet Sunday
        date:
          description: Record date.
          example: "2025-01-19"
        feels:
          description: Mood/feeling value.
          example: calm
        tags:
          description: Tags assigned to this record.
          example: [rest, family]
        color_Tags:
          description: Colors of the tags assigned to this record.
          example: ["#4f9dff", "#ffb84f"]
        highlights:
          description: Highlights of the day.
          example: [Long walk, Called mom]
        all_Tags:
          description: Complete tag list of the user (stored in `usersTags`, replacing the previous value).
          example: [rest, family, work]
        all_Color_Tags:
          description: Complete tag color list of the user (stored in `usersTags`, replacing the previous value).
          example: ["#4f9dff", "#ffb84f", "#ff4f4f"]

    DiaryEditRecord:
      description: |
        The `record` object of `POST /api/diary-edit`. `id_record` identifies the record to update; it is not
        validated, but without a matching value no record is updated (404 is expected). All other properties
        are optional in the sense that the server does not validate them.
      allOf:
        - type: object
          required: [id_record]
          properties:
            id_record:
              description: Identifier of the record to update (matched against `usersRecords.id_record`).
              example: 12
        - $ref: '#/components/schemas/DiaryCreateRequest'

    DiaryEditRequest:
      type: object
      required: [record]
      properties:
        record:
          $ref: '#/components/schemas/DiaryEditRecord'
