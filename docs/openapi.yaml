openapi: 3.0.3

info:
  title: Diary API
  version: 1.0.0
  description: |
    Backend API for a personal diary application (Express + Supabase). It covers account registration and
    e-mail confirmation, cookie-based session handling, diary records with tags, and account settings.


    ## Authentication

    Authentication is **cookie-based**. The `Authorization: Bearer` header is **not** read anywhere in the
    implementation and must not be used.

    | Cookie          | Content                                      | Signed with      | Cookie `Max-Age`        |
    |-----------------|----------------------------------------------|------------------|-------------------------|
    | `access_token`  | JWT with payload `{ "email": <user e-mail> }` | `JWT_SECRET`     | 900 s (15 minutes)      |
    | `refresh_token` | JWT with payload `{ "email": <user e-mail> }` | `REFRESH_SECRET` | 604800 s (7 days)       |

    - Both cookies are set by `POST /api/login`; `POST /api/refresh` re-issues only `access_token`.
    - Cookie attributes: `HttpOnly`, `Path=/`. `Secure` is set and `SameSite=None` is used when the `PROD`
      environment variable equals `"true"`; otherwise `Secure` is not set and `SameSite=Lax` is used.
    - The JWT lifetime (`expiresIn`) comes from the `JWT_EXPIRE` / `REFRESH_EXPIRE` environment variables,
      while the cookie `Max-Age` values above are hard-coded in the source.
    - The user is identified by the `email` claim of the access token; every protected endpoint looks the user
      up by that e-mail address.
    - Swagger UI cannot send or inspect `HttpOnly` cookies from the "Try it out" panel. Call `POST /api/login`
      from a client that keeps cookies (browser session, Postman cookie jar) and the cookies are then sent
      automatically.

    ## CORS

    The server enables CORS with `credentials: true` for exactly two origins: `http://localhost:3000` and
    `https://diary-cosmic-liard.vercel.app`.

    ## Request bodies

    All JSON request bodies are parsed with `express.json()`, so requests must use
    `Content-Type: application/json`.

    ## Notes

    1. **Dynamic error messages.** Several 400 responses return `error.message` from Supabase; the text is
       produced by the database layer and cannot be determined from the source.

servers:
  - url: http://localhost:{port}
    description: Local development server (port is configured through the `PORT` environment variable).
    variables:
      port:
        default: "3001"
        description: Value of the `PORT` environment variable. 3001 is taken from a comment in the source code.

tags:
  - name: Authentication
    description: Registration, e-mail confirmation, login, token refresh and logout.
  - name: Account
    description: Current-user information and account settings (e-mail, password, username, deletion).
  - name: Diary
    description: Diary records and the user's tag lists.
  - name: System
    description: Service health.

paths:
  /api/register:
    post:
      tags: [Authentication]
      operationId: register
      summary: Register a new user
      description: |
        Creates a user with a bcrypt-hashed password and a random
        confirmation token, then sends a confirmation e-mail with a link to `GET /api/confirm?token=...`.
        The account cannot log in until the e-mail is confirmed.

        Only `email` and `password` are validated.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              username: diary_user
              email: user@example.com
              password: S3cretPass!
      responses:
        '200':
          description: User created and confirmation e-mail sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: "Registered! Check your email to confirm."
        '400':
          description: Validation failed or the database rejected the insert.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              examples:
                missingFields:
                  summary: "`email` or `password` missing/empty"
                  value:
                    message: "Email and password required"
                databaseError:
                  summary: Supabase insert error (message is dynamic)
                  value:
                    message: "<<Dynamic error message from database>>"
        '500':
          description: The confirmation e-mail could not be sent, or an unexpected error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              examples:
                emailSendFailed:
                  value:
                    message: "Email send failed"
                serverError:
                  value:
                    message: "Server error"

  /api/confirm:
    get:
      tags: [Authentication]
      operationId: confirmEmail
      summary: Confirm a registration e-mail address
      description: |
        Click the link in the registration email to confirm your registration. Sender's name: <<Light>>. The email may end up in the “Spam” folder of your inbox.
      security: []
      parameters:
        - name: token
          in: query
          required: true
          description: Confirmation token generated at registration (64 hexadecimal characters as generated by the server).
          schema:
            type: string
          example: 3f9a1c0e5b7d4a62b8c1e9d0a7f3c5b2e1d4f6a8b0c2d4e6f8a1b3c5d7e9f0a2
      responses:
        '200':
          description: E-mail confirmed.
          content:
            text/html:
              schema:
                type: string
              example: "Email confirmed! You can now login."
        '400':
          description: Token missing, or the token is invalid/expired (RPC returned an error or no success).
          content:
            text/html:
              schema:
                type: string
              examples:
                tokenMissing:
                  value: "The token is missing"
                tokenInvalid:
                  value: "Invalid or expired token. Or just try login ;) \n Or...wait a minute and try again(gmail)"
        '500':
          description: Unexpected error.
          content:
            text/html:
              schema:
                type: string
              example: "Server error"

  /api/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Log in
      description: |
        Verifies the e-mail/password pair and, on success, sets the `access_token` and `refresh_token`
        HttpOnly cookies. The response body contains only a message; no token is returned in the body.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: user@example.com
              password: S3cretPass!
      responses:
        '200':
          description: Logged in. Cookies `access_token` and `refresh_token` are set.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookieLogin'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: "Logged in!"
        '400':
          description: Missing fields, unknown e-mail, or wrong password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              examples:
                missingFields:
                  value:
                    message: "Email and password required"
                invalidCredentials:
                  value:
                    message: "Invalid email or password"
        '403':
          description: The e-mail address has not been confirmed yet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: "Email not confirmed"
        '500':
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: "Server error"

  /api/refresh:
    post:
      tags: [Authentication]
      operationId: refreshToken
      summary: Issue a new access token
      description: |
        Reads the `refresh_token` cookie, verifies it with `REFRESH_SECRET`, and sets a new `access_token`
        cookie. No request body is accepted.
      security:
        - refreshTokenCookie: []
      responses:
        '200':
          description: New `access_token` cookie set.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookieRefresh'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: "Token refreshed"
        '401':
          description: The refresh cookie is missing, or the refresh token is invalid/expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              examples:
                noRefreshToken:
                  value:
                    message: "No refresh token"
                invalidRefreshToken:
                  value:
                    message: "Invalid refresh token"

  /api/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: Log out
      description: |
        Clears the `access_token` and `refresh_token` cookies. Tokens are not invalidated server-side.
      security: []
      responses:
        '200':
          description: Cookies cleared.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookieClear'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: "Logged out"

  /api/me:
    get:
      tags: [Account]
      operationId: getCurrentUser
      summary: Get the current user
      description: |
        Verifies the `access_token` cookie and returns `username`, `email` and `created_at` of the matching
        user.
      security:
        - accessTokenCookie: []
      responses:
        '200':
          description: Current user data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
              example:
                user:
                  username: diary_user
                  email: user@example.com
                  created_at: "2026-10-20T18:54:43.326119+00:00"
        '401':
          $ref: '#/components/responses/InvalidToken'
        '403':
          $ref: '#/components/responses/NoToken'
        '404':
          $ref: '#/components/responses/UserNotFound'

  /api/ping:
    get:
      tags: [System]
      operationId: ping
      summary: Health check
      description: Keep-alive endpoint. Requires no authentication.
      security: []
      responses:
        '200':
          description: Server is running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PingResponse'
              example:
                status: ok

  /api/diary:
    post:
      tags: [Diary]
      operationId: getDiary
      summary: List the user's diary records and tags
      description: |
        Returns all rows of `usersRecords` belonging to the authenticated user, ordered by `created_at`
        descending, together with the user's `usersTags` row.

        `diaryAllTags` is the user's `usersTags` row, or an empty array `[]` when no row exists.
      security:
        - accessTokenCookie: []
      responses:
        '200':
          description: Diary records and tags.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiaryListResponse'
              example:
                example:
                  diaryRecords:
                    - id_user: 314
                      title: My day at the park
                      date: '2026-10-26'
                      feels:
                        - happy
                      tags:
                        - outdoors
                        - fun
                      color_Tags:
                        - green
                        - blue
                      highlights:
                        - text: Had a great picnic
                          color: green
                      id_record: c72aee5f-fc3c-4ed1-9413-4860733eb4b5
                      created_at: '2026-10-24T12:39:27.254935+00:00'
                  diaryAllTags:
                    all_Tags:
                      - outdoors
                      - fun
                      - apple
                    all_Color_Tags:
                      - green
                      - blue
                      - purple
                    id_user: 314
        '400':
          description: Supabase returned an error while reading records or tags (message is dynamic).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: "<<Error message is dynamic>>"
        '401':
          $ref: '#/components/responses/InvalidToken'
        '403':
          $ref: '#/components/responses/NoToken'
        '404':
          $ref: '#/components/responses/UserNotFound'

  /api/diary-send:
    post:
      tags: [Diary]
      operationId: createDiaryRecord
      summary: Create a diary record and store the user's tag lists
      description: |
        Inserts a new record for the authenticated user.
        If user provided new tags --> update database with new tags in `all_Tags` and `all_Color_Tags` arrays.

        If the record insert succeeds and the tag insert fails, the response is
        400 but the record remains.
      security:
        - accessTokenCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiaryCreateRequest'
            example:
             example:
              title: My day at the park
              date: '2026-10-26'
              feels:
                - happy
              tags:
                - outdoors
                - fun
              color_Tags:
                - green
                - blue
              highlights:
                - text: Had a great picnic
                  color: green
              all_Tags:
                - outdoors
                - fun
                - apple
              all_Color_Tags:
                - green
                - blue
                - purple
      responses:
        '200':
          description: Record and tags inserted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: "Record and tags added"
        '400':
          description: Supabase returned an error for the record insert or the tag upsert (message is dynamic).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: "?"
        '401':
          description: |
            Invalid, malformed or expired
            access token. `message` is the caught error's `message` (dynamic).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: "Error message is dynamic"
        '403':
          $ref: '#/components/responses/NoToken'
        '404':
          $ref: '#/components/responses/UserNotFound'

  /api/diary-allTags:
    post:
      tags: [Diary]
      operationId: getAllTags
      summary: Get the user's tag lists
      description: |
        Returns all of the user's tags (`all_Tags`) and their colors (`all_Color_Tags`).
        If the user has no saved tags yet, you get status 200 and a message instead of the lists.

        This is a `POST` request, but you don't need to send anything in the body.
      security:
        - accessTokenCookie: []
      responses:
        '200':
          description: Tag lists, or a message if there are no tags yet.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/TagsData'
                  - $ref: '#/components/schemas/MessageResponse'
              examples:
                tags:
                  summary: Tags found
                  value:
                    all_Tags:
                      - outdoors
                      - fun
                      - apple
                    all_Color_Tags:
                      - green
                      - blue
                      - purple
                noRecords:
                  summary: No tags yet
                  value:
                    message: "No records to edit"
        '401':
          description: The access token is invalid or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: "Invalid token"
        '403':
          $ref: '#/components/responses/NoToken'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/diary-record/{id}:
    get:
      tags: [Diary]
      operationId: getDiaryRecord
      summary: Get one diary record by id
      description: |
        Returns one diary record by its `id_record`. You can only open your own records.

        `all_Tags` and `all_Color_Tags` may be missing from the response.
      security:
        - accessTokenCookie: []
      parameters:
        - $ref: '#/components/parameters/RecordId'
      responses:
        '200':
          description: The requested record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiaryRecordResponse'
              example:
                id_record: c72aee5f-fc3c-4ed1-9413-4860733eb4b5
                id_user: 314
                title: My day at the park
                date: '2026-10-26'
                feels:
                  - happy
                tags:
                  - outdoors
                  - fun
                color_Tags:
                  - green
                  - blue
                highlights:
                  - text: Had a great picnic
                    color: green
                all_Tags:
                  - outdoors
                  - fun
                  - apple
                all_Color_Tags:
                  - green
                  - blue
                  - purple
        '401':
          $ref: '#/components/responses/InvalidToken'
        '403':
          $ref: '#/components/responses/NoToken'
        '404':
          description: There is no record with this id for the current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: "Record not found"

  /api/diary-edit:
    post:
      tags: [Diary]
      operationId: updateDiaryRecord
      summary: Update a diary record and the user's tag lists
      description: |
        Changes an existing diary record and updates the user's tag lists in `all_Tags` and `all_Color_Tags`.
        Everything must be sent inside the `record` object. `id_record` says which record to change.

        The tags are updated first, so they can change even if the record is not found (404).
        If the user has no saved tags yet, the tag lists are not updated.

        If `record` is missing (or the user is not found), the response is 401 `"Invalid token"`.
      security:
        - accessTokenCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiaryEditRequest'
            example:
              record:
                id_record: c72aee5f-fc3c-4ed1-9413-4860733eb4b5
                title: My day at the park (edited)
                date: '2026-10-26'
                feels:
                  - happy
                tags:
                  - outdoors
                  - fun
                color_Tags:
                  - green
                  - blue
                highlights:
                  - text: Had a great picnic
                    color: green
                all_Tags:
                  - outdoors
                  - fun
                  - apple
                all_Color_Tags:
                  - green
                  - blue
                  - purple
      responses:
        '200':
          description: Record and tags updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: "Record updated"
        '400':
          description: The database returned an error while updating the tags or the record (message is dynamic).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: "<<Error message is dynamic>>"
        '401':
          description: |
            The access token is invalid or expired, or something else went wrong
            (for example, the `record` object is missing).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: "Invalid token"
        '403':
          $ref: '#/components/responses/NoToken'
        '404':
          description: There is no record with this id for the current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: "Record not found"

  /api/diary-delete/{id}:
    delete:
      tags: [Diary]
      operationId: deleteDiaryRecord
      summary: Delete a diary record
      description: |
        Deletes one diary record by its `id_record`. You can only delete your own records.
        The user's tag lists stay as they are.

        Deleting a record that does not exist also returns 200.
      security:
        - accessTokenCookie: []
      parameters:
        - $ref: '#/components/parameters/RecordId'
      responses:
        '200':
          description: Record deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: "Record deleted"
        '400':
          description: The database returned an error while deleting (message is dynamic).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: "<<Error message is dynamic>>"
        '401':
          $ref: '#/components/responses/InvalidToken'
        '403':
          $ref: '#/components/responses/NoToken'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/change-email-request:
    post:
      tags: [Account]
      operationId: requestEmailChange
      summary: Request an e-mail address change
      description: |
        Starts changing the email address. A confirmation email with a link is sent to `newEmail`.
        The address is changed only after that link is opened (see `GET /api/change-email-confirm`).
        The email may end up in the “Spam” folder of your inbox.

        The server does not check that `newEmail` is a valid address.

        Unlike other endpoints, an invalid or expired access token here gives 500 `"Server error"`, not 401.
      security:
        - accessTokenCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeEmailRequest'
            example:
              newEmail: new.address@example.com
      responses:
        '200':
          description: Confirmation email sent to the new address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: "Confirm new email first"
        '403':
          $ref: '#/components/responses/NoToken'
        '500':
          description: |
            The access token is invalid or expired, the email could not be sent, or another unexpected error happened.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: "Server error"

  /api/change-email-confirm:
    get:
      tags: [Account]
      operationId: confirmEmailChange
      summary: Confirm an e-mail address change
      description: |
        Click the link in the confirmation email to confirm your new email address.
        After that you are logged out, so log in again with the new address.

        You don't need to be logged in to open the link, the token in it is enough.
        The answer is plain text (served as `text/html`).
      security: []
      parameters:
        - name: token
          in: query
          required: true
          description: Token from the link in the confirmation email (created by `POST /api/change-email-request`).
          schema:
            type: string
          example: 9b2d7e4f1a6c3e8d5b0f2a4c6e8d1f3b5a7c9e0d2f4b6a8c1e3d5f7a9b0c2d4e
      responses:
        '200':
          description: Email changed. You are logged out, log in again.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookieClear'
          content:
            text/html:
              schema:
                type: string
              example: "Email updated. Login again."
        '400':
          description: The token is missing from the link.
          content:
            text/html:
              schema:
                type: string
              example: "Token missing"
        '401':
          description: No user matches this token (the link is wrong or has already been used).
          content:
            text/html:
              schema:
                type: string
              example: "Invalid token"
        '500':
          description: Unexpected error.
          content:
            text/html:
              schema:
                type: string
              example: "Server error"

  /api/change-password:
    post:
      tags: [Account]
      operationId: changePassword
      summary: Change the password
      description: |
        Changes the password. Send your current password and the new one.
        If the current password is correct, the new one is saved.

        No password strength rules are checked. You stay logged in after the change.
      security:
        - accessTokenCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
            example:
              currentPassword: S3cretPass!
              newPassword: EvenB3tterPass!
      responses:
        '200':
          description: Password updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: "Password updated"
        '400':
          description: A password is missing, the current password is wrong, or the database could not save the new one.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              examples:
                missingFields:
                  value:
                    message: "Passwords required"
                wrongCurrentPassword:
                  value:
                    message: "Current password incorrect"
                databaseError:
                  summary: Database error (message is dynamic)
                  value:
                    message: "<<Error message is dynamic>>"
        '401':
          $ref: '#/components/responses/InvalidToken'
        '403':
          $ref: '#/components/responses/NoToken'
        '404':
          $ref: '#/components/responses/UserNotFound'

  /api/change-username:
    post:
      tags: [Account]
      operationId: changeUsername
      summary: Change the username
      description: |
        Changes the username of the current user. There are no rules for length or characters.
      security:
        - accessTokenCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeUsernameRequest'
            example:
              username: new_diary_user
      responses:
        '200':
          description: Username updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: "Username updated"
        '400':
          description: "`username` is missing or empty, or the database could not save it."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              examples:
                missingUsername:
                  value:
                    message: "Username required"
                databaseError:
                  summary: Database error (message is dynamic)
                  value:
                    message: "<<Error message is dynamic>>"
        '401':
          $ref: '#/components/responses/InvalidToken'
        '403':
          $ref: '#/components/responses/NoToken'

  /api/user-delete:
    delete:
      tags: [Account]
      operationId: deleteAccount
      summary: Delete the current account
      description: |
        Deletes the current account and logs the user out.
        No request body and no password are needed, so the account is deleted right away and this cannot be undone.

        Whether diary records and tags are deleted together with the account depends on the database settings.
      security:
        - accessTokenCookie: []
      responses:
        '200':
          description: Account deleted. You are logged out.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookieClear'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: "Account deleted"
        '400':
          description: The database returned an error while deleting (message is dynamic).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: "<<Error message is dynamic>>"
        '401':
          $ref: '#/components/responses/InvalidToken'
        '403':
          $ref: '#/components/responses/NoToken'

components:
  securitySchemes:
    accessTokenCookie:
      type: apiKey
      in: cookie
      name: access_token
      description: |
        Cookie with the login token. It is set by `POST /api/login` and renewed by `POST /api/refresh`,
        and it lasts 15 minutes. The Bearer scheme is not supported.

        No cookie gives 403 `"No token"`. An invalid or expired token gives 401
        (the message depends on the endpoint).
    refreshTokenCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: |
        Cookie that is used to get a new `access_token`. It is set by `POST /api/login` and lasts 7 days.
        Only `POST /api/refresh` uses it.

  parameters:
    RecordId:
      name: id
      in: path
      required: true
      description: The id of the diary record (`id_record`).
      schema:
        type: string
      example: "c72aee5f-fc3c-4ed1-9413-4860733eb4b5"

  headers:
    SetCookieLogin:
      description: |
        Two cookies are set: `access_token` (lasts 15 minutes) and `refresh_token` (lasts 7 days).
        Both are `HttpOnly`. In production (`PROD=true`) they are also `Secure` with `SameSite=None`,
        otherwise `SameSite=Lax`.
      schema:
        type: string
      examples:
        accessToken:
          value: "access_token=<jwt>; Max-Age=900; Path=/; Expires=<HTTP-date>; HttpOnly; SameSite=Lax"
        refreshToken:
          value: "refresh_token=<jwt>; Max-Age=604800; Path=/; Expires=<HTTP-date>; HttpOnly; SameSite=Lax"
    SetCookieRefresh:
      description: |
        A new `access_token` cookie (lasts 15 minutes). The cookie settings are the same as at login.
      schema:
        type: string
      example: "access_token=<jwt>; Max-Age=900; Path=/; Expires=<HTTP-date>; HttpOnly; SameSite=Lax"
    SetCookieClear:
      description: |
        Both cookies (`access_token` and `refresh_token`) are removed from the browser.
        This happens on logout, account deletion and e-mail change confirmation.
      schema:
        type: string
      example: "access_token=; Path=/; Expires=Thu, 01 Jan 1970 00:00:00 GMT"

  responses:
    NoToken:
      description: You are not logged in (the `access_token` cookie is missing).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
          example:
            message: "No token"
    InvalidToken:
      description: The access token is invalid or expired.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
          example:
            message: "Invalid token"
    UserNotFound:
      description: No user was found for this access token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
          example:
            message: "User not found"
    ServerError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
          example:
            message: "Server error"

  schemas:
    MessageResponse:
      type: object
      description: A simple JSON answer with a text message. Used for both success and error messages.
      required: [message]
      properties:
        message:
          type: string
          example: "Logged in!"

    PingResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok

    RegisterRequest:
      type: object
      description: |
        `email` and `password` are required. `username` is optional.
      required: [email, password]
      properties:
        username:
          type: string
          description: Display name (optional).
          example: diary_user
        email:
          type: string
          description: Used to log in and to receive the confirmation email. The format is not checked.
          example: user@example.com
        password:
          type: string
          description: Saved as a hash. No password strength rules are checked.
          example: S3cretPass!

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          example: user@example.com
        password:
          type: string
          example: S3cretPass!

    ChangeEmailRequest:
      type: object
      description: |
        `newEmail` is not checked by the server, but the confirmation email is sent there,
        so it must be a real address.
      required: [newEmail]
      properties:
        newEmail:
          type: string
          example: new.address@example.com

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          example: S3cretPass!
        newPassword:
          type: string
          description: The new password. No password strength rules are checked.
          example: EvenB3tterPass!

    ChangeUsernameRequest:
      type: object
      required: [username]
      properties:
        username:
          type: string
          example: new_diary_user

    User:
      type: object
      description: User data returned by `GET /api/me`.
      properties:
        username:
          type: string
          example: diary_user
        email:
          type: string
          example: user@example.com
        created_at:
          description: When the account was created.
          example: "2026-10-20T18:54:43.326119+00:00"

    MeResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/User'

    TagsData:
      type: object
      description: The user's tags and their colors.
      properties:
        all_Tags:
          description: All tags of the user.
          example:
            - outdoors
            - fun
            - apple
        all_Color_Tags:
          description: Colors of the user's tags.
          example:
            - green
            - blue
            - purple

    UsersTagsRow:
      description: The user's saved tags, as they are stored in the database.
      allOf:
        - $ref: '#/components/schemas/TagsData'
        - type: object
          properties:
            id_user:
              description: Id of the user who owns these tags.
              example: 314
          additionalProperties: true

    DiaryRecord:
      type: object
      description: One diary record, as it is stored in the database.
      properties:
        id_record:
          description: Record id.
          example: c72aee5f-fc3c-4ed1-9413-4860733eb4b5
        id_user:
          description: Id of the user who owns the record.
          example: 314
        title:
          description: Record title.
          example: My day at the park
        date:
          description: Record date.
          example: '2026-10-26'
        feels:
          description: How the user felt.
          example:
            - happy
        tags:
          description: Tags of this record.
          example:
            - outdoors
            - fun
        color_Tags:
          description: Colors of this record's tags.
          example:
            - green
            - blue
        highlights:
          description: Highlighted parts of the record (text and color).
          example:
            - text: Had a great picnic
              color: green
        created_at:
          description: When the record was created. Records are sorted by this, newest first.
          example: '2026-10-24T12:39:27.254935+00:00'
      additionalProperties: true

    DiaryListResponse:
      type: object
      required: [diaryRecords, diaryAllTags]
      properties:
        diaryRecords:
          type: array
          description: The user's records, newest first. Empty array if there are none.
          items:
            $ref: '#/components/schemas/DiaryRecord'
        diaryAllTags:
          description: The user's tags and colors, or an empty array (`[]`) if there are none.
          oneOf:
            - $ref: '#/components/schemas/UsersTagsRow'
            - type: array
              maxItems: 0
              items: {}

    DiaryRecordResponse:
      type: object
      description: |
        Answer of `GET /api/diary-record/{id}`. `all_Tags` and `all_Color_Tags` may be missing.
      properties:
        id_record:
          description: Record id.
          example: c72aee5f-fc3c-4ed1-9413-4860733eb4b5
        id_user:
          description: Id of the current user.
          example: 314
        title:
          description: Record title.
          example: My day at the park
        date:
          description: Record date.
          example: '2026-10-26'
        feels:
          description: How the user felt.
          example:
            - happy
        tags:
          description: Tags of this record.
          example:
            - outdoors
            - fun
        color_Tags:
          description: Colors of this record's tags.
          example:
            - green
            - blue
        highlights:
          description: Highlighted parts of the record (text and color).
          example:
            - text: Had a great picnic
              color: green
        all_Tags:
          description: All tags of the user. May be missing.
          example:
            - outdoors
            - fun
            - apple
        all_Color_Tags:
          description: Colors of all tags of the user. May be missing.
          example:
            - green
            - blue
            - purple

    DiaryCreateRequest:
      type: object
      description: |
        Body of `POST /api/diary-send`. The server does not check any of these fields,
        so none of them is strictly required.
      properties:
        title:
          description: Record title.
          example: My day at the park
        date:
          description: Record date.
          example: '2026-10-26'
        feels:
          description: How the user felt.
          example:
            - happy
        tags:
          description: Tags of this record.
          example:
            - outdoors
            - fun
        color_Tags:
          description: Colors of this record's tags.
          example:
            - green
            - blue
        highlights:
          description: Highlighted parts of the record (text and color).
          example:
            - text: Had a great picnic
              color: green
        all_Tags:
          description: All tags of the user. Replaces the previously saved list.
          example:
            - outdoors
            - fun
            - apple
        all_Color_Tags:
          description: Colors of all tags of the user. Replaces the previously saved list.
          example:
            - green
            - blue
            - purple

    DiaryEditRecord:
      description: |
        The `record` object of `POST /api/diary-edit`. `id_record` says which record to change,
        the other fields are the new values. If no record of the current user has this id, you get 404.
      allOf:
        - type: object
          required: [id_record]
          properties:
            id_record:
              description: Id of the record to change.
              example: c72aee5f-fc3c-4ed1-9413-4860733eb4b5
        - $ref: '#/components/schemas/DiaryCreateRequest'

    DiaryEditRequest:
      type: object
      required: [record]
      properties:
        record:
          $ref: '#/components/schemas/DiaryEditRecord'
